name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend
        run: npm --prefix backend install
      - name: Install frontend
        run: npm --prefix frontend install
      - name: Test
        run: npm test
      - name: Dependency audit
        run: npm run audit
